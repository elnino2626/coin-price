name: Docker Build and Test

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t coinbase-webservice .

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Run container and test endpoints
        run: |
          set -exo pipefail  # Enable debugging and strict error checking

          # Cleanup handler
          trap 'docker logs webservice && docker stop webservice' EXIT

          # Start container
          docker run -d -p 5000:5000 --name webservice coinbase-webservice
          
          # Wait for service with timeout
          echo "Waiting for service to start..."
          for i in {1..10}; do
            if curl -sSf http://localhost:5000/health >/dev/null; then
              break
            fi
            sleep 1
          done

          # Verify health check
          echo "--- Testing /health ---"
          curl -v http://localhost:5000/health

          # Test valid currencies
          for currency in USD EUR; do
            echo "--- Testing /$currency ---"
            response=$(curl -sSf "http://localhost:5000/$currency")
            echo "Raw response: $response"
            
            # Validate response structure
            echo "$response" | jq -e '.data'
            echo "$response" | jq -e '.data.amount'
            echo "$response" | jq -e '.data.base == "BTC"'
          done

          # Test invalid currency
          echo "--- Testing invalid currency ---"
          status_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/XYZ)
          echo "Status code: $status_code"
          [ "$status_code" -eq 400 ] || {
            echo "❌ Expected 400 for invalid currency"
            exit 1
          }

          response=$(curl -s http://localhost:5000/XYZ)
          echo "Error response: $response"
          echo "$response" | jq -e '.error' >/dev/null
          echo "$response" | jq -e '.error | contains("not supported")' >/dev/null

          echo "✅ All tests passed!"
